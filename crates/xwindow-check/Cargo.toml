[package]
name = "xwindow-check"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "A stand-in adapter that compiles xwindow's generated model and both backends"
publish = false

[features]
# Defines android_main for a host in C, which provides xwindow_main.
android-main = []

[build-dependencies]
xwindow-backend = { path = "../xwindow-backend" }
xwindow-bindgen = { path = "../xwindow-bindgen" }

[dependencies]
xwindow-core = { workspace = true }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
winit = "0.30"
raw-window-handle = "0.6"
xwindow-clipboard = { path = "../xwindow-clipboard" }

# winit on Android needs an activity: the one the host's Java side starts.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }

# Opens real windows; does nothing unless XWINDOW_DESKTOP=1.
[[test]]
name = "desktop"
harness = false

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Wayland maps a window only once it has a frame, which the test draws, and
# takes input from virtual devices the test holds under sway, or from
# mutter's RemoteDesktop over D-Bus under GNOME.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "5"
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen"] }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
