[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/xwindow"
license = "MIT"

[workspace.dependencies]
xwindow-core = { path = "crates/xwindow-core" }
x_idl = { git = "https://github.com/rayzor-blade/x-idl.git", rev = "bce92e00cd3b13b1b1ca0e94020b065a28d9e911" }

# x-idl's library names, variant results and wire queue are not in a pinned
# revision yet; build against the sibling checkout until they are.
[patch."https://github.com/rayzor-blade/x-idl.git"]
x_idl = { path = "../x-idl" }
